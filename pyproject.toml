[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ipi-adaptive"
version = "0.1.0"
description = "Adaptive adversarial attacks for Indirect Prompt Injection research"
requires-python = ">=3.10"
dependencies = [
    "litellm>=1.0",
    "openai>=1.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
local = [
    "transformers>=4.40",
    "accelerate>=0.28",
    "torch>=2.1",
]
agentdojo = [
    "agentdojo>=0.1",
]
# PISanitizer reconstructs attention from model internals (torch/transformers)
# and finds peaks in the resulting signal (scipy).
pisanitizer = [
    "transformers>=4.40",
    "accelerate>=0.28",
    "torch>=2.1",
    "scipy>=1.10",
]
dev = [
    "pandas",
    "jupyter",
    "ipykernel",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ipi*"]

[tool.setuptools.package-data]
# Ship data files needed at runtime (pip install git+... builds a wheel; without
# this, non-.py files are dropped and the package breaks on Kaggle).
"ipi.datasets" = ["*.json"]
"ipi.attacks" = ["*.json"]
